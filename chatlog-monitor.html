<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chat Display for OBS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
        }

        .chat {
            margin: 0;
            padding: 0;
            position: relative;
            width: 100dvw;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
        }

        .bg-color {
            padding: 16pt;
            border-radius: 8pt;
        }

        .message {
            font-family: "Poppins", sans-serif;
            font-size: 32pt;
            color: #55FF22;
            font-weight: normal;
            text-decoration: none solid rgb(68, 68, 68);
            font-style: normal;
            font-variant: normal;
            text-transform: none;
            position: relative;
            display: block;
            text-shadow: 0 2px 4px #112211;
            animation: flashFade 2s ease-out;
            padding: 1pt;
        }

        .timestamp {
            display: none;
        }

        .channel {
            position: absolute;
            font-size: 18pt;
            font-weight: light;
            top: -10pt;
            left: -6pt;
        }

        .djriiser {
            color: #008cff;
        }

        .bg-color-djriiser {
            background-color: rgba(0, 140, 255, 0.2);
        }

        .niddelicious {
            color: #ff9900;
        }

        .bg-color-niddelicious {
            background-color: rgba(255, 153, 0, 0.2);
        }

        .deejayskye {
            color: #ff0080;
        }

        .bg-color-deejayskye {
            background-color: rgba(255, 0, 128, 0.2);
        }

        .djtobbelito {
            color: #c300ff;
        }

        .bg-color-djtobbelito {
            background-color: rgba(195, 0, 255, 0.2);
        }

        .author {
            font-size: 32pt;
            font-weight: bold;
            display: inline-block;
            padding-right: 8pt;
        }

        .content {
            font-size: 32pt;
            display: inline-block;
        }


        @keyframes flashFade {
            from {
                background-color: white;
            }

            to {
                background-color: transparent;
            }
        }
    </style>
</head>

<body>
    <div id="chat" class="chat">

    </div>
    <script>
        function addMessage(timestamp, channel, author, messageContent) {
            const chatDiv = document.getElementById('chat');
            const channelBgDiv = document.createElement('div');
            channelBgDiv.classList.add('bg-color');
            channelBgDiv.classList.add('bg-color-' + channel);
            chatDiv.appendChild(channelBgDiv);

            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            channelBgDiv.appendChild(messageDiv);


            const timestampDiv = document.createElement('div');
            timestampDiv.classList.add('timestamp');
            timestampDiv.textContent = timestamp;
            messageDiv.appendChild(timestampDiv);

            const channelDiv = document.createElement('div');
            channelDiv.classList.add('channel');
            channelDiv.classList.add(channel);
            channelDiv.textContent = channel;
            messageDiv.appendChild(channelDiv);

            const authorDiv = document.createElement('div');
            authorDiv.classList.add('author');
            authorDiv.textContent = author + " : ";
            messageDiv.appendChild(authorDiv);

            const contentDiv = document.createElement('div');
            contentDiv.classList.add('content');
            contentDiv.textContent = messageContent;
            messageDiv.appendChild(contentDiv);

            chatDiv.insertBefore(channelBgDiv, chatDiv.firstChild)
            scrollToBottom();
        }

        function scrollToBottom() {
            const chatDiv = document.getElementById('chat');
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        var ws; // WebSocket instance
        var wsUrl = 'ws://192.168.9.216:9011'; // Your WebSocket URL
        var reconnectInterval = 3000; // Time to wait before attempting to reconnect (5 seconds)

        function connect() {
            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
                console.log('WebSocket connected');
            };

            ws.onmessage = function (message) {
                const data = JSON.parse(event.data);
                addMessage(data.timestamp, data.channel, data.author, data.message);
            };

            ws.onclose = function (e) {
                console.log('WebSocket closed. Attempting to reconnect...', e.reason);
                setTimeout(function () {
                    connect();
                }, reconnectInterval);
            };

            ws.onerror = function (err) {
                console.error('WebSocket encountered error: ', err.message, 'Closing socket');
                ws.close();
            };
        }
        connect();
    </script>
</body>

</html>
